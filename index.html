  <style>
    /* ── Design Tokens ─────────────────────────────────────── */
    :root {
      --color-bg:        #000000;
      --color-surface:   #0a0a0a;
      --color-surface-2: #141414;
      --color-border:    #222222;
      --color-border-2:  #333333;
      --color-accent:    #ff4f00;
      --color-accent-hi: #ff6a20;
      --color-accent-lo: #1a0800;
      --color-accent-glow: #331000;
      --color-accent-border: #401400;
      --color-text:      #ffffff;
      --color-muted:     #a0a0a0;
      --color-muted-2:   #666666;
      --radius:          0px;
      --radius-lg:       0px;
      --transition:      all 0.15s ease-out;
    }

    /* ── Base ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Hanken Grotesk', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      position: relative;
    }

    /* ── Grain Texture Overlay ── */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* ── Scrollbar ─────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--color-bg); }
    ::-webkit-scrollbar-thumb {
      background: var(--color-border-2);
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--color-accent); }

    /* ── Header ────────────────────────────────────────────── */
    .header-glass {
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
    }

    /* ── Typography ────────────────────────────────────────── */
    .display-font { font-family: 'Fraunces', serif; }

    .accent-text {
      color: var(--color-accent);
    }

    /* ── Cards ─────────────────────────────────────────────── */
    .prompt-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .prompt-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--color-accent);
      transform: scaleY(0);
      transition: transform 0.22s ease;
      transform-origin: bottom;
    }
    .prompt-card:hover {
      border-color: var(--color-border-2);
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 0 1px var(--color-border-2);
    }
    .prompt-card:hover::before { transform: scaleY(1); }

    /* ── Buttons ────────────────────────────────────────────── */
    .btn-copy {
      background: var(--color-accent);
      color: #0A0A0E;
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.04em;
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }
    .btn-copy:hover { background: var(--color-accent-hi); transform: scale(1.04); }
    .btn-copy:active { transform: scale(0.97); }

    .btn-view {
      background: var(--color-surface-2);
      border: 1px solid var(--color-border-2);
      color: var(--color-muted);
      font-family: 'Fraunces', serif;
      font-size: 15px;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-view:hover { border-color: var(--color-accent); color: var(--color-accent); }
    .btn-view.active {
      background: var(--color-accent-lo);
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    /* ── Search ─────────────────────────────────────────────── */
    .search-input {
      background: var(--color-surface-2);
      border: 1px solid var(--color-border-2);
      border-radius: var(--radius);
      color: var(--color-text);
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 14px;
      padding: 10px 16px;
      outline: none;
      transition: var(--transition);
      width: 100%;
    }
    .search-input::placeholder { color: var(--color-muted-2); }
    .search-input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-glow);
    }

    /* ── Category Pills ─────────────────────────────────────── */
    .cat-pill {
      background: var(--color-surface-2);
      border: 1px solid var(--color-border-2);
      color: var(--color-muted);
      font-family: 'Fraunces', serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 7px 16px;
      border-radius: 100px;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }
    .cat-pill:hover { border-color: var(--color-accent); color: var(--color-accent); }
    .cat-pill.active {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: #09090E;
    }

    /* ── Category Badge ─────────────────────────────────────── */
    .cat-badge {
      display: inline-block;
      font-family: 'Fraunces', serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-accent);
      background: var(--color-accent-lo);
      border: 1px solid var(--color-accent-border);
      padding: 3px 9px;
      border-radius: 6px;
    }

    .tag-chip {
      display: inline-block;
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: var(--color-muted);
      background: transparent;
      border: 1px solid var(--color-border-2);
      padding: 2px 8px;
      border-radius: 5px;
    }

    /* ── Stat Card ──────────────────────────────────────────── */
    .stat-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 20px 28px;
      text-align: center;

    .stat-num {
      font-family: 'Fraunces', serif;
      font-size: 36px;
      font-weight: 800;
      color: var(--color-accent);

    }
    .stat-label {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-muted);
      margin-top: 4px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ── Expand button ──────────────────────────────────────── */
    .btn-expand {
      background: none;
      border: none;
      color: var(--color-accent);
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-expand:hover { color: var(--color-accent-hi); }

    /* ── Toast ──────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--color-accent);
      color: #09090E;
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 13px;
      padding: 12px 28px;
      border-radius: 100px;
      box-shadow: 0 8px 32px #662000;
      z-index: 9999;
      animation: toastIn 0.25s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ── Fade-in ────────────────────────────────────────────── */
    .fade-in {
      animation: fadeUp 0.4s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Empty state ────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--color-muted);
    }
    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    /* ── Footer ─────────────────────────────────────────────── */
    .footer {
      border-top: 1px solid var(--color-border);
      background: var(--color-surface);
    }

    /* ── Visually hidden (screen-reader only) ───────────────── */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border-width: 0;
    }

    /* ── Divider line in stat bar ───────────────────────────── */
    .stat-divider {
      width: 1px;
      background: var(--color-border-2);
      align-self: stretch;
    }

    /* ── Content truncation ─────────────────────────────────── */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── List view card override ────────────────────────────── */
    .list-card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 16px 20px;
    }
    .list-id {
      font-family: 'Fraunces', serif;
      font-size: 24px;
      font-weight: 800;
      color: var(--color-border-2);
      min-width: 48px;
      text-align: center;

      background: var(--color-accent);
      color: #09090E;
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 28px;

      cursor: pointer;

    a.link-accent {

      text-decoration: none;
      font-weight: 600;
    }
    a.link-accent:hover { color: var(--color-accent-hi); text-decoration: underline; }
  </style>
</head>
