      // AGENTIC AI (81-95)
      { id: 81,  title: "Multi-Step Research Agent",   category: "Agentic AI",          description: "Autonomous deep research workflow.",                           tags: ["Research","Agent"],       content: "You are a research agent. Given a topic, perform the following steps autonomously: 1) Search for 5 authoritative sources, 2) Extract key findings from each, 3) Identify knowledge gaps, 4) Synthesize findings into a comprehensive report with citations, 5) Suggest 3 follow-up research questions. Topic: [INSERT TOPIC]" },
      { id: 82,  title: "Code Review Agent",           category: "Agentic AI",          description: "Automated code quality analysis.",                             tags: ["Coding","Agent"],         content: "Act as a senior code review agent. Analyze the provided code and autonomously: 1) Identify bugs and security vulnerabilities, 2) Suggest performance optimizations, 3) Check for best practices violations, 4) Recommend refactoring opportunities, 5) Generate a prioritized action list with code examples. Provide reasoning for each suggestion." },
      { id: 83,  title: "Customer Support Triage Agent",category: "Agentic AI",         description: "Intelligent ticket classification and routing.",               tags: ["Support","Agent"],        content: "You are a customer support triage agent. For each incoming ticket: 1) Classify urgency (Critical/High/Medium/Low), 2) Identify category (Technical/Billing/Feature Request/Bug), 3) Extract key information and sentiment, 4) Route to appropriate team, 5) Draft initial response if possible, 6) Flag for human review if needed. Explain your classification reasoning." },
      { id: 84,  title: "Data Pipeline Orchestrator",  category: "Agentic AI",          description: "Autonomous ETL workflow manager.",                             tags: ["Data","Agent"],           content: "Act as a data pipeline orchestration agent. Given a data processing requirement: 1) Design the ETL workflow steps, 2) Identify data quality checks needed, 3) Suggest error handling strategies, 4) Propose monitoring metrics, 5) Generate pseudocode for implementation, 6) Estimate resource requirements. Optimize for reliability and performance." },
      { id: 85,  title: "Content Strategy Agent",      category: "Agentic AI",          description: "Multi-platform content planning.",                             tags: ["Marketing","Agent"],      content: "You are a content strategy agent. For the given business goal: 1) Analyze target audience segments, 2) Research trending topics in the niche, 3) Generate a 30-day content calendar across 3 platforms, 4) Suggest content types and formats, 5) Identify collaboration opportunities, 6) Propose KPIs for measurement. Provide strategic reasoning for each recommendation." },
      { id: 86,  title: "Meeting Summarization Agent", category: "Agentic AI",          description: "Intelligent transcript analysis.",                             tags: ["Productivity","Agent"],   content: "Act as a meeting analysis agent. From the provided transcript: 1) Extract key decisions and action items with owners, 2) Identify unresolved issues and blockers, 3) Summarize main discussion points by topic, 4) Flag follow-up meetings needed, 5) Generate a concise executive summary, 6) Create a prioritized next steps list. Use clear formatting." },
      { id: 87,  title: "Competitive Intelligence Agent",category: "Agentic AI",        description: "Automated market analysis.",                                   tags: ["Business","Agent"],       content: "You are a competitive intelligence agent. For the specified competitor: 1) Research their recent product launches and features, 2) Analyze their pricing and positioning, 3) Identify their strengths and weaknesses, 4) Track their hiring patterns and strategic moves, 5) Assess customer sentiment, 6) Generate strategic recommendations. Cite all sources." },
      { id: 88,  title: "Bug Reproduction Agent",      category: "Agentic AI",          description: "Systematic issue investigation.",                              tags: ["Testing","Agent"],        content: "Act as a bug reproduction agent. Given a bug report: 1) Identify missing information and ask clarifying questions, 2) Create step-by-step reproduction instructions, 3) Determine affected versions and environments, 4) Assess severity and user impact, 5) Suggest potential root causes, 6) Recommend temporary workarounds. Be thorough and methodical." },
      { id: 89,  title: "Learning Path Designer",      category: "Agentic AI",          description: "Personalized curriculum builder.",                             tags: ["Education","Agent"],      content: "You are an adaptive learning path agent. For the given skill goal: 1) Assess prerequisite knowledge required, 2) Break down into progressive learning modules, 3) Recommend specific resources (courses, books, projects), 4) Design hands-on practice exercises, 5) Create milestone assessments, 6) Estimate time commitment. Adapt difficulty based on learner level." },
      { id: 90,  title: "API Integration Planner",     category: "Agentic AI",          description: "Technical integration roadmap.",                               tags: ["Development","Agent"],    content: "Act as an API integration planning agent. For integrating [Service A] with [Service B]: 1) Map data flows and required endpoints, 2) Identify authentication and rate limit requirements, 3) Design error handling and retry logic, 4) Plan data transformation steps, 5) Suggest caching strategies, 6) Create implementation checklist with testing criteria." },
      { id: 91,  title: "Crisis Communication Agent",  category: "Agentic AI",          description: "Rapid response messaging.",                                    tags: ["PR","Agent"],             content: "You are a crisis communication agent. For the given situation: 1) Assess severity and stakeholder impact, 2) Draft initial holding statement, 3) Identify key messages and tone, 4) Create platform-specific responses (email, social, press), 5) Anticipate follow-up questions, 6) Propose timeline for updates. Prioritize transparency and empathy." },
      { id: 92,  title: "Security Audit Agent",        category: "Agentic AI",          description: "Comprehensive vulnerability scanner.",                         tags: ["Security","Agent"],       content: "Act as a security audit agent. For the provided system architecture: 1) Identify potential security vulnerabilities, 2) Assess authentication and authorization mechanisms, 3) Review data encryption practices, 4) Check for common OWASP risks, 5) Evaluate third-party dependencies, 6) Generate prioritized remediation plan with implementation steps." },
      { id: 93,  title: "Sales Qualification Agent",   category: "Agentic AI",          description: "Lead scoring and prioritization.",                             tags: ["Sales","Agent"],          content: "You are a sales qualification agent. For each lead: 1) Score based on BANT criteria (Budget, Authority, Need, Timeline), 2) Identify decision makers and influencers, 3) Research company background and recent activity, 4) Assess product-market fit, 5) Suggest personalized outreach strategy, 6) Predict conversion likelihood with reasoning. Provide confidence scores." },
      { id: 94,  title: "Workflow Automation Designer",category: "Agentic AI",          description: "Process optimization mapper.",                                 tags: ["Productivity","Agent"],   content: "Act as a workflow automation agent. For the described manual process: 1) Map current workflow steps and pain points, 2) Identify automation opportunities, 3) Suggest tools and integration options, 4) Design optimized workflow with decision points, 5) Calculate time/cost savings, 6) Create implementation roadmap with quick wins first." },
      { id: 95,  title: "Prompt Chain Architect",      category: "Agentic AI",          description: "Multi-step AI workflow builder.",                              tags: ["AI","Agent"],             content: "You are a prompt chain architecture agent. For the complex task: 1) Decompose into sequential sub-tasks, 2) Design prompts for each step with clear inputs/outputs, 3) Identify decision branches and loops, 4) Plan data passing between steps, 5) Add validation and error handling, 6) Optimize for token efficiency. Create a visual workflow diagram description." },

      // ADVANCED AGENTIC AI & MODEL-SPECIFIC (96-115)
      { id: 96,  title: "Multi-Agent Coordination System",   category: "Agentic AI",   description: "Orchestrate multiple AI agents working together.",              tags: ["Agent","Coordination"],   content: "Design a multi-agent system where: 1) A Lead Agent receives the task and delegates to specialized sub-agents, 2) A Research Agent gathers information autonomously, 3) An Analysis Agent processes findings, 4) A Synthesis Agent compiles results, 5) All agents communicate via structured handoffs, 6) Implement conflict resolution when agents disagree. Provide a coordination protocol and example task execution flow." },
      { id: 97,  title: "Context Engineering Blueprint",     category: "Agentic AI",   description: "Optimize token context for agent efficiency.",                  tags: ["Context","Optimization"], content: "You are a context engineering agent. For this complex task: 1) Analyze which information is essential vs. supplementary, 2) Design a context window strategy that prioritizes critical data, 3) Implement dynamic context updates based on task progress, 4) Create retrieval patterns that minimize token waste, 5) Design a caching strategy for frequently referenced information, 6) Provide token budget allocation across task phases." },
      { id: 98,  title: "Gemini 2.0 Deep Research Mode",    category: "Agentic AI",   description: "Multi-step autonomous research with citation.",                 tags: ["Gemini","Research"],      content: "Activate deep research mode: Given the topic [INSERT TOPIC], perform autonomous multi-step research: 1) Generate 5 diverse search strategies, 2) Explore each avenue systematically, 3) Extract and verify key findings with source citations, 4) Identify contradictions or gaps in current knowledge, 5) Synthesize a comprehensive report with confidence scores, 6) Suggest follow-up research directions with reasoning. Use chain-of-thought for all analytical steps." },
      { id: 99,  title: "Agentic Code Reviewer (Jules-Style)",category: "Coding",      description: "Autonomous bug fixing and test generation.",                   tags: ["Agent","Code"],           content: "Act as an autonomous coding agent like Google Jules. For the provided codebase: 1) Scan for bugs, security vulnerabilities, and code smells, 2) Create a prioritized fix plan with test cases, 3) Generate pull requests with detailed commit messages, 4) Write comprehensive unit tests for untested functions, 5) Update dependencies and check for breaking changes, 6) Run all tests and report results. Work asynchronously and parallelize where possible." },
      { id: 100, title: "Agent-to-Agent Protocol Designer",  category: "Agentic AI",   description: "Standardized inter-agent communication.",                      tags: ["Protocol","Agent"],       content: "Design an Agent-to-Agent communication protocol: 1) Define message structure (intent, payload, priority, context), 2) Create handshake and acknowledgment patterns, 3) Establish error handling and retry logic, 4) Design state synchronization mechanisms, 5) Implement capability negotiation between agents, 6) Provide JSON schema and example message exchanges for a multi-agent research task." },
      { id: 101, title: "Gemini Multimodal Chain-of-Thought",category: "Image Generation", description: "Reason through vision + text tasks.",                      tags: ["Gemini","Multimodal"],    content: "Using Gemini's multimodal capabilities: Analyze the provided image and text prompt together. 1) Describe what you see in the image with spatial details, 2) Identify how it relates to the text query, 3) Reason step-by-step about potential modifications, 4) Explain your creative decisions before generating, 5) Produce a detailed image generation prompt that addresses the query, 6) Include negative prompts to avoid common issues." },
      { id: 102, title: "Claude Context Engineering (MCP)",  category: "Agentic AI",   description: "Model Context Protocol implementation.",                       tags: ["Claude","MCP"],           content: "Implement Claude's Model Context Protocol for this task: 1) Map all required knowledge domains and data sources, 2) Design selective retrieval strategies to minimize context pollution, 3) Create a hierarchical context structure (core → supporting → reference), 4) Implement progressive context loading based on task phase, 5) Design context compression techniques for long documents, 6) Provide a context management plan with token budgets for each section." },
      { id: 103, title: "Social Media Agent (Platform-Adaptive)", category: "Marketing", description: "Auto-generate platform-optimized content.",                  tags: ["Agent","Social"],         content: "You are an autonomous social media agent. For the campaign topic [INSERT TOPIC]: 1) Generate platform-specific content (LinkedIn: professional thought leadership, Twitter/X: viral thread with hooks, Instagram: visual carousel with captions, TikTok: short video script), 2) Adapt tone and format for each platform's algorithm, 3) Include optimal posting times and hashtag strategies, 4) Design A/B test variations, 5) Create engagement response templates, 6) Provide analytics tracking recommendations." },
      { id: 104, title: "Few-Shot Adaptive Agent",           category: "Agentic AI",   description: "Learn from examples and improve.",                             tags: ["Learning","Agent"],       content: "Create a few-shot learning agent: 1) Analyze these 3 example tasks and solutions: [PROVIDE EXAMPLES], 2) Extract patterns and decision-making rules, 3) Apply learned patterns to new similar task: [NEW TASK], 4) Explain your reasoning using extracted rules, 5) Identify where the new task differs from examples, 6) Suggest how you would update your rules based on feedback. Show meta-learning awareness." },
      { id: 105, title: "Negative Prompt Engineering",       category: "Image Generation", description: "Comprehensive avoidance instructions.",                    tags: ["Gemini","Image"],         content: "For this image generation task: 1) Create the primary positive prompt with rich detail (subject, style, composition, lighting, colors, technical specs), 2) Generate an equally detailed negative prompt listing: unwanted artifacts, distortions, style conflicts, quality issues, compositional errors, 3) Include model-specific negative terms (e.g., 'blurry, low quality, distorted faces, extra limbs, watermark'), 4) Balance specificity vs. over-constraint, 5) Provide reasoning for each negative term." },
      { id: 106, title: "OpenAI Swarm Pattern: Handoffs",    category: "Agentic AI",   description: "Agent task handoff orchestration.",                            tags: ["OpenAI","Swarm"],         content: "Implement OpenAI Swarm handoff pattern: Design a customer service system with: 1) Triage Agent (classifies incoming request), 2) Technical Agent (handles tech issues), 3) Billing Agent (manages payments), 4) Escalation Agent (complex cases). Define: handoff triggers, context preservation during transfers, routing logic with conditions, fallback paths when agents are unavailable, and success metrics. Provide implementation pseudocode." },
      { id: 107, title: "Gemini Grounding with Web Search",  category: "Agentic AI",   description: "Real-time fact verification agent.",                           tags: ["Gemini","Grounding"],     content: "Create a fact-grounding agent using Gemini's web search capability: 1) Make a claim or generate content about [TOPIC], 2) Automatically search the web for supporting evidence, 3) Verify each major claim with at least 2 independent sources, 4) Flag any unsupported or contradictory information, 5) Cite sources with URLs and access dates, 6) Provide confidence scores (High/Medium/Low) for each statement based on source quality and consensus." },
      { id: 108, title: "Anthropic Prompt Caching Strategy", category: "Agentic AI",   description: "Optimize costs with smart caching.",                           tags: ["Claude","Optimization"],  content: "Design a prompt caching strategy for Claude: 1) Identify static vs. dynamic content in your prompts, 2) Structure prompts to maximize cache hits (put stable context first), 3) Design cache-friendly few-shot examples, 4) Calculate cost savings from caching (show token math), 5) Implement cache invalidation logic for when context updates, 6) Provide before/after prompt structures with estimated cost reduction." },
      { id: 109, title: "Vision Board + Goal Tracking (2026)",category: "Image Generation", description: "Gemini-powered visual goal planner.",                     tags: ["Gemini","2026"],          content: "Using Gemini's image generation: Create a 2026 vision board with integrated tracking. Design a hand-drawn, notebook-style layout featuring: 1) Q1-Q4 quarterly goal sections with knolling arrangement, 2) Fitness goals (with progress trackers), 3) Financial milestones (with visual graphs), 4) Learning objectives (with certification badges), 5) Travel destinations (with map pins), 6) Use yellow highlighter effects, cross-hatching, and handwritten annotations. Include space for monthly check-ins." },
      { id: 110, title: "LLM-as-Judge Self-Evaluation",      category: "Agentic AI",   description: "Agent quality control system.",                                tags: ["Evaluation","Agent"],     content: "Implement LLM-as-Judge pattern: 1) Generate a response to the user query: [QUERY], 2) Create evaluation criteria (accuracy, helpfulness, safety, conciseness), 3) Self-evaluate your response using those criteria with scores 1-10, 4) Identify specific weaknesses or risks, 5) Generate an improved version addressing the issues, 6) Re-evaluate the new version, 7) Explain your reasoning for all judgments. Show decision transparency." },
      { id: 111, title: "Conditional Tool Use Routing",       category: "Agentic AI",   description: "Smart agent tool selection.",                                  tags: ["Tools","Agent"],          content: "Design a conditional tool-use agent: Given the query [QUERY], 1) Analyze what tools are needed (web search, calculator, code interpreter, image generator, database), 2) Create decision tree for tool selection with if-then conditions, 3) Determine optimal tool execution order (parallel vs. sequential), 4) Handle tool failures with fallback strategies, 5) Combine results from multiple tools intelligently, 6) Explain your routing logic and show the execution plan." },
      { id: 112, title: "Gemini Long Context (1M Tokens)",   category: "Coding",        description: "Analyze massive codebases efficiently.",                       tags: ["Gemini","Context"],       content: "Leverage Gemini's extended context window: For this large codebase (assume 500K tokens): 1) Load entire repository into context, 2) Create architectural overview by analyzing all files, 3) Identify cross-file dependencies and patterns, 4) Find potential bugs that span multiple modules, 5) Suggest refactoring opportunities considering global impact, 6) Generate comprehensive documentation. Demonstrate how you utilize the full context vs. traditional chunking approaches." },
      { id: 113, title: "Parallel Agent Execution",           category: "Agentic AI",   description: "Simultaneous multi-agent processing.",                         tags: ["Parallel","Agent"],       content: "Design parallel agent execution: For the task [TASK], deploy agents concurrently: 1) Agent A: Market research, 2) Agent B: Competitor analysis, 3) Agent C: Customer sentiment analysis, 4) Agent D: Technical feasibility study. Specify: parallel execution triggers, race condition handling, result aggregation strategy, timeout management, partial failure recovery, and final synthesis method. Show expected time savings vs. sequential execution." },
      { id: 114, title: "Input/Output Guardrails Agent",      category: "Agentic AI",   description: "Safety and validation layer.",                                 tags: ["Safety","Agent"],         content: "Create a guardrails agent: 1) INPUT VALIDATION: Check user input for prompt injection attempts, PII leakage risks, malicious content, off-topic requests, 2) PROCESSING: Flag if task requires human oversight, 3) OUTPUT VALIDATION: Scan generated content for hallucinations, harmful content, privacy violations, copyright issues, 4) REMEDIATION: Suggest safe alternatives or explain why request was blocked, 5) LOGGING: Record all violations for audit. Provide decision logic and examples." },
      { id: 115, title: "Gemini Spatial Reasoning Prompt",   category: "Image Generation", description: "Complex 3D scene composition.",                            tags: ["Gemini","Spatial"],       content: "Using Gemini's improved spatial understanding: Generate an image with precise spatial relationships: 'Create a realistic scene with: 1) A red cube positioned 2 feet to the LEFT of a blue sphere, 2) A yellow cylinder standing BEHIND both objects by 3 feet, 3) A green cone placed IN FRONT of the cube by 1 foot, 4) All objects on a wooden table, 5) Camera angle: 45-degree elevated view from the front-right, 6) Soft natural lighting from top-left.' Verify spatial accuracy in your reasoning before generating." },

      // GEMINI 3.5 FLASH & GOOGLE AI PRODUCTS (116-125)
      { id: 116, title: "Gemini 3 Flash Deep Think Mode",    category: "Agentic AI",   description: "PhD-level reasoning with modulated thinking.",                 tags: ["Gemini","Deep Think"],    content: "Activate Gemini 3 Flash Deep Think mode for complex problem-solving: 1) Set thinking level to 'Pro' (maximum reasoning depth), 2) For the problem [INSERT COMPLEX PROBLEM], explore multiple solution hypotheses simultaneously, 3) Use iterative reasoning rounds to evaluate each approach, 4) Show your thinking process step-by-step (chain-of-thought), 5) Identify potential flaws or edge cases in each solution, 6) Synthesize the optimal solution with confidence score, 7) Explain trade-offs and assumptions. Use ~30% fewer tokens than standard approaches while maintaining depth." },
      { id: 117, title: "Agentic Vision: Think-Act-Observe", category: "Agentic AI",   description: "Active image investigation with Python.",                       tags: ["Gemini","Vision"],        content: "Use Gemini 3 Flash's agentic vision to actively investigate this image: 1) THINK: Analyze the image and identify areas requiring closer inspection, 2) ACT: Generate Python code to zoom, crop, or manipulate specific regions, 3) OBSERVE: Document findings from each focused examination, 4) ITERATE: Repeat the Think-Act-Observe loop for detailed analysis, 5) ANNOTATE: Generate direct annotations highlighting key findings, 6) PLOT: Create visual plots of extracted data if applicable, 7) REPORT: Synthesize comprehensive findings with visual evidence. Move beyond passive viewing to active investigation." },
      { id: 118, title: "NotebookLM Research Assistant",     category: "Agentic AI",   description: "Grounded research with source citations.",                     tags: ["NotebookLM","Research"],  content: "Use NotebookLM as an AI research expert: 1) Upload sources: PDFs, websites, YouTube transcripts, Google Docs on [TOPIC], 2) Ask complex questions that require cross-referencing multiple sources, 3) Request summaries with inline citations to prevent hallucinations, 4) Identify connections and contradictions between sources, 5) Generate a podcast-style audio discussion explaining key insights, 6) Create a comprehensive research report grounded only in provided materials, 7) Export findings with proper attribution. Ensure all responses cite specific sources." },
      { id: 119, title: "AI Studio Rapid Prototyping",       category: "Coding",        description: "Fast AI-first app development.",                               tags: ["AI Studio","Prototype"],  content: "Build an AI-first application in Google AI Studio: 1) Test multiple prompt variations using the playground interface, 2) Experiment with Gemini models for text analysis and Imagen for image generation, 3) Configure thinking modes (Fast/Thinking/Pro) for different use cases, 4) Generate API keys and set up project structure, 5) Build a working prototype using natural language instructions, 6) Test with various inputs and edge cases, 7) Export to production code with proper rate limit handling. Optimize for speed and iteration." },
      { id: 120, title: "Full-Stack App Generator (Snowbunny)",category: "Coding",      description: "One-shot website and application creation.",                   tags: ["Gemini 3.5","Full-Stack"],content: "Leveraging Gemini 3.5's 'Snowbunny' capabilities for full-stack generation: Given requirements for [APPLICATION TYPE]: 1) Generate complete one-shot website or application with frontend and backend, 2) Create high-fidelity SVG and vector graphics for the UI, 3) Implement responsive design with modern CSS frameworks, 4) Generate all necessary routes, components, and state management, 5) Include authentication, database schemas, and API endpoints, 6) Add native audio generation for interactive elements if needed, 7) Provide deployment instructions and environment setup. Demonstrate lateral reasoning for complex architecture decisions." },
      { id: 121, title: "Gemini Deep Research Agent",        category: "Agentic AI",   description: "Multi-step autonomous research synthesis.",                    tags: ["Gemini","Deep Research"], content: "Use Gemini's Deep Research mode as your AI research assistant: For topic [RESEARCH TOPIC], 1) PLAN: Autonomously break down the research query into investigative sub-questions, 2) EXPLORE: Search and analyze multiple online sources (web, papers, reports), 3) PROCESS: Handle multimodal inputs (images, PDFs, audio, video) to contextualize findings, 4) ANALYZE: Verify information across sources and flag contradictions, 5) SYNTHESIZE: Compile a comprehensive report with proper citations, 6) TIMELINE: Complete in minutes what would take humans hours, 7) OUTPUT: Deliver structured report with confidence scores and follow-up recommendations." },
      { id: 122, title: "AI Mode Shopping Agent",            category: "Agentic AI",   description: "Agentic commerce with UCP.",                                   tags: ["Google Search","Commerce"],content: "Use Google Search's AI Mode for agentic shopping: 1) Research products directly in Search without visiting individual websites, 2) Compare features, prices, and reviews across multiple retailers, 3) Use Business Agent to engage in branded AI chat for specific products, 4) Leverage Universal Commerce Protocol (UCP) for seamless transactions, 5) Get personalized recommendations based on preferences and constraints, 6) Complete purchase decisions with AI-assisted comparison tables, 7) Access real-time inventory and pricing data. Transform search into autonomous buying decisions." },
      { id: 123, title: "Multimodal Live API Agent",         category: "Agentic AI",   description: "Real-time interactive AI with streaming.",                     tags: ["Gemini 2.0","Live API"],  content: "Build a real-time agent with Gemini 2.0 Flash Multimodal Live API: 1) Set up streaming connections for text, audio, and video inputs, 2) Process user interactions in real-time with minimal latency, 3) Implement native text-to-speech for voice responses, 4) Handle context switching across different modalities seamlessly, 5) Maintain conversation state with 1M token context window, 6) Generate images inline during conversations, 7) Create interactive experiences (tutoring, customer support, collaboration). Optimize for responsive, human-like interactions." },
      { id: 124, title: "NotebookLM MCP Integration",        category: "Agentic AI",   description: "Programmatic agent control for research.",                     tags: ["NotebookLM","MCP"],       content: "Build an AI agent with NotebookLM MCP integration: 1) Use notebooklm-mcp to programmatically control NotebookLM operations, 2) Automate source ingestion from various formats (PDF, web, docs, video), 3) Chain NotebookLM with other AI agents for complex workflows, 4) Extract structured data from research findings, 5) Generate custom reports with specific formatting requirements, 6) Implement quality checks to verify citation accuracy, 7) Scale research tasks across multiple notebooks. Enable agentic research at scale." },
      { id: 125, title: "Gemini 3 Flash Vision + Code",      category: "Coding",        description: "Visual analysis with executable Python.",                      tags: ["Gemini","Vision","Code"], content: "Combine Gemini 3 Flash vision and code generation for data analysis: 1) Upload a chart, graph, or visualization image, 2) AI generates Python code to extract data from the visual, 3) Execute code to create structured datasets, 4) Perform statistical analysis on extracted data, 5) Generate improved visualizations with annotations, 6) Iterate with zoom/crop operations to verify accuracy, 7) Output: Clean dataset + analysis code + enhanced visuals. Achieve 5-10% improvement in vision benchmarks through agentic iteration." },

      // WRITING & CONTENT (126-135)
      { id: 126, title: "Ghostwriter: Narrative Arc",        category: "Writing & Content", description: "Convert rough notes into a compelling 5-act story.",        tags: ["Writing","Storytelling"], content: "Act as a professional ghostwriter. Take the following rough notes: [NOTES]. Transform them into a compelling narrative using the 5-act story structure (Exposition, Rising Action, Climax, Falling Action, Resolution). Maintain a [TONE] tone throughout." },
      { id: 127, title: "SEO Blog Post Generator",           category: "Writing & Content", description: "Create high-ranking articles with keyword optimization.",   tags: ["SEO","Blog"],             content: "Generate a 1,500-word blog post about [TOPIC]. Include the following keywords: [KEYWORDS]. Structure with H1, H2, and H3 headers. Ensure a keyword density of 1.5% and include a meta description and 3 suggested alt-text for images." },
      { id: 128, title: "Viral Newsletter Hook",             category: "Writing & Content", description: "Craft opening lines that guarantee high open rates.",        tags: ["Newsletter","Marketing"], content: "Write 5 different 'hooks' for a newsletter about [TOPIC]. Each hook should use a different psychological trigger: Curiosity, Urgency, Scarcity, Social Proof, and Contrarianism. Keep each under 150 characters." },
      { id: 129, title: "Creative Fiction World-Builder",    category: "Writing & Content", description: "Develop rich, immersive lore for fantasy settings.",         tags: ["Fiction","World-Building"],content: "Develop the lore for a new fantasy city located in [GEOGRAPHY]. Describe its social hierarchy, main export, a unique local custom, and the secret tension threatening to destroy it. Use evocative, sensory language." },
      { id: 130, title: "Persuasive Op-Ed Drafter",         category: "Writing & Content", description: "Write authoritative opinion pieces for major publications.",  tags: ["Journalism","Opinion"],   content: "Write a 700-word Op-Ed arguing [POSITION] regarding [CURRENT EVENT]. Use the 'Problem-Agitation-Solution' framework. Include 3 credible-sounding (but hypothetical) data points to support the argument and address one major counter-argument." },
      { id: 131, title: "Micro-Copy for UX",                category: "Writing & Content", description: "Optimized tooltips and error messages.",                      tags: ["UX","Product"],           content: "Generate micro-copy for a [PRODUCT TYPE] app. Include: 1) A friendly welcome message, 2) A clear error message for a failed payment, 3) An encouraging tooltip for a completed task, and 4) A low-friction CTA for upgrading to Pro." },
      { id: 132, title: "Poetic Brand Manifesto",           category: "Writing & Content", description: "Inspiring prose that defines company values.",                tags: ["Branding","Manifesto"],   content: "Write a poetic, rhythmic brand manifesto for a company that sells [PRODUCT]. Focus on the emotional transformation the customer feels. Use metaphors related to [THEME] and keep it under 300 words." },
      { id: 133, title: "Script to Comic Panel",            category: "Writing & Content", description: "Translate dialogue into visual storyboard descriptions.",     tags: ["Comics","Visual"],        content: "Translate the following dialogue script into 4 detailed comic book panel descriptions: [SCRIPT]. Specify the 'camera' angle, character expressions, background details, and placement of speech bubbles for each panel." },
      { id: 134, title: "Technical Documentation Simplifier",category: "Writing & Content", description: "Turn complex jargon into beginner-friendly guides.",         tags: ["Technical","Documentation"],content: "Take the following complex technical documentation: [DOCS]. Rewrite it for a non-technical audience. Use the 'Explain Like I'm Five' (ELI5) approach for core concepts but maintain a professional tone. Use bullet points and analogies." },
      { id: 135, title: "Satirical News Satirist",          category: "Writing & Content", description: "The Onion-style headlines and articles.",                     tags: ["Satire","Humor"],         content: "Write 10 satirical news headlines in the style of The Onion regarding [TOPIC]. Then, write a 300-word lead article for the most absurd headline, featuring a fictional 'expert' quote and a 'local man' reaction." },

      // EDUCATION & LEARNING (136-143)
      { id: 136, title: "Socratic Tutor Agent",             category: "Education & Learning", description: "Learn through guided questioning, not just answers.",    tags: ["Tutoring","Socratic"],    content: "Act as a Socratic tutor for the topic [TOPIC]. Do not give me the answers directly. Instead, ask me a series of probing questions that lead me to discover the core principles myself. Start with a foundational question based on my current level: [LEVEL]." },
      { id: 137, title: "First Principles Deconstructor",   category: "Education & Learning", description: "Break complex subjects down to fundamental truths.",      tags: ["Logic","First Principles"],content: "Deconstruct the concept of [CONCEPT] using First Principles Thinking. 1) Identify current assumptions, 2) Break down into fundamental truths, 3) Reconstruct the concept from the ground up. Provide a clear analogy for the final result." },
      { id: 138, title: "Interactive Quiz Master",          category: "Education & Learning", description: "Generate adaptive testing based on performance.",          tags: ["Quiz","Assessment"],      content: "Generate a 10-question multiple-choice quiz on [SUBJECT]. After I answer each question, tell me if I was correct, provide a detailed explanation of the concept, and adjust the difficulty of the next question based on my accuracy." },
      { id: 139, title: "Spaced Repetition Flashcards",     category: "Education & Learning", description: "Anki-ready card generation for long-term memory.",         tags: ["Memory","Anki"],          content: "Create 20 high-quality flashcards for [TOPIC] following the 'Minimum Information Principle'. Format as: Front;Back. Use cloze deletions where appropriate. Focus on high-yield concepts that are often misunderstood." },
      { id: 140, title: "Curriculum Roadmap Builder",       category: "Education & Learning", description: "Step-by-step path to mastery in any field.",               tags: ["Roadmap","Self-Learning"],content: "Design a 6-month self-study roadmap to go from beginner to advanced in [SKILL]. Divide into monthly themes, weekly focus areas, and specific projects to complete. Recommend 3 essential 'North Star' resources for each month." },
      { id: 141, title: "Analogy Engine",                   category: "Education & Learning", description: "Explain abstract concepts through familiar scenarios.",    tags: ["Analogies","Teaching"],   content: "Explain the abstract concept of [CONCEPT] using 3 different analogies tailored for: 1) A 10-year-old child, 2) A CEO of a Fortune 500 company, and 3) A professional athlete. Highlight why each analogy works for that specific audience." },
      { id: 142, title: "The Feynman Explainer",            category: "Education & Learning", description: "Master a topic by explaining it simply.",                  tags: ["Feynman","Clarity"],      content: "I will provide an explanation of [TOPIC]. Your job is to act as a critical listener. Identify any 'jargon' I use, point out gaps in my logic, and ask me to simplify specific sections until a person with no background in the subject could understand it perfectly." },
      { id: 143, title: "Scientific Paper Summarizer",      category: "Education & Learning", description: "Extract methodology and results from dense papers.",       tags: ["Research","Academic"],    content: "Summarize the following scientific paper: [TEXT]. Break it down into: 1) The core hypothesis, 2) Methodology used, 3) Key findings with statistical significance, 4) Major limitations, and 5) Real-world implications. Use clear, non-academic language." },

      // AUDIO & MUSIC (144-149)
      { id: 144, title: "Suno/Udio Lyric Architect",        category: "Audio & Music",   description: "Structure lyrics for AI music generators.",                   tags: ["Lyrics","Suno"],          content: "Write lyrics for a [GENRE] song about [THEME]. Structure the output for AI music models like Suno or Udio using tags: [Intro], [Verse 1], [Pre-Chorus], [Chorus], [Bridge], [Outro]. Include style descriptors like [Atmospheric], [High-Energy], or [Melancholic]." },
      { id: 145, title: "Podcast Show Notes Expert",        category: "Audio & Music",   description: "Generate timestamps and summaries from transcripts.",          tags: ["Podcast","Content"],      content: "Based on the following podcast transcript: [TRANSCRIPT], generate professional show notes. Include: 1) A catchy 3-sentence summary, 2) 5 key takeaways, 3) Timestamped 'Chapters' with descriptive titles, and 4) A list of all resources mentioned." },
      { id: 146, title: "Sound Design Prompt",              category: "Audio & Music",   description: "Detailed descriptions for foley and SFX generation.",         tags: ["SFX","Audio"],            content: "Generate a detailed audio generation prompt for a [SOUND EFFECT NAME]. Describe the texture (e.g., metallic, organic), the environment (e.g., cavernous, muffled), the attack/decay characteristics, and the emotional resonance (e.g., unsettling, triumphant)." },
      { id: 147, title: "Music Theory Harmonizer",          category: "Audio & Music",   description: "Suggest chord progressions for any melody.",                   tags: ["Theory","Composition"],   content: "I have a melody in the key of [KEY] with these notes: [NOTES]. Suggest 3 different chord progressions: 1) A standard pop/rock progression, 2) A sophisticated jazz-influenced progression, and 3) A cinematic, tension-building progression. Explain the theory behind each." },
      { id: 148, title: "AI Voiceover Script Director",     category: "Audio & Music",   description: "Add emotion and pacing markers to text.",                      tags: ["Voiceover","Direction"],  content: "Take the following script: [SCRIPT]. Add direction markers for an AI voiceover engine (like ElevenLabs). Use bracketed instructions for: [speed], [tone_shift], [pause:duration], and [emphasis]. Ensure the final output sounds natural and emotionally resonant." },
      { id: 149, title: "Genre-Fusion Experimenter",        category: "Audio & Music",   description: "Combine disparate styles into unique compositions.",            tags: ["Creative","Composition"], content: "Describe a musical composition that fuses [GENRE A] with [GENRE B]. Detail how the instrumentation, rhythm, and vocal style from each genre would interact. Provide 5 reference tracks that share elements of this proposed fusion." },

      // DATA ANALYSIS (150-157)
      { id: 150, title: "Insight Extractor (CSV/JSON)",     category: "Data Analysis",   description: "Identify trends and anomalies in raw datasets.",               tags: ["Data","Insights"],        content: "Analyze the following dataset: [DATA]. 1) Identify the 3 most significant trends, 2) Spot any statistical anomalies or outliers, 3) Calculate basic correlations between [VARIABLE A] and [VARIABLE B], 4) Summarize the 'story' the data is telling in 3 sentences." },
      { id: 151, title: "SQL Query Generator",              category: "Data Analysis",   description: "Convert natural language into complex SQL.",                   tags: ["SQL","Database"],         content: "Write a SQL query that [NATURAL LANGUAGE DESCRIPTION OF REQUEST]. The database schema is: [SCHEMA]. Use JOINs where appropriate, implement filtering for [CONDITIONS], and group the results by [CATEGORY] with a descending sort on [METRIC]." },
      { id: 152, title: "Data Visualization Strategist",    category: "Data Analysis",   description: "Suggest the best chart types for your metrics.",               tags: ["Visualization","Analytics"],content: "I have the following data: [DATA DESCRIPTION]. My goal is to [GOAL, e.g., show growth over time]. Suggest 3 different visualization types. For each, explain: 1) Why it's effective for this specific data, 2) What to avoid (clutter, misleading axes), and 3) The ideal color palette for clarity." },
      { id: 153, title: "Hypothesis Testing Framework",     category: "Data Analysis",   description: "Design A/B tests with statistical rigor.",                     tags: ["Statistics","A/B Testing"],content: "I want to test if [CHANGE] improves [METRIC]. Design an A/B test framework: 1) Define the Null and Alternative hypotheses, 2) Calculate required sample size for [POWER] and [SIGNIFICANCE], 3) Identify potential confounding variables, and 4) Explain how to interpret a p-value of 0.04." },
      { id: 154, title: "Predictive Model Architect",       category: "Data Analysis",   description: "Outline machine learning workflows.",                          tags: ["ML","Predictive"],        content: "Act as a Data Scientist. I want to predict [TARGET VARIABLE] based on [FEATURES]. Outline the machine learning pipeline: 1) Feature engineering suggestions, 2) Choice of 3 candidate algorithms with pros/cons, 3) Evaluation metrics (RMSE, F1, etc.), and 4) A strategy for handling imbalanced data." },
      { id: 155, title: "Competitor Benchmarking",          category: "Data Analysis",   description: "Compare your performance against industry standards.",          tags: ["Business","Benchmarking"],content: "Analyze my performance metrics: [MY METRICS] against these industry benchmarks: [BENCHMARKS]. Identify the largest 'gap' areas, suggest 3 actionable steps to close those gaps, and project potential ROI if industry averages are met." },
      { id: 156, title: "Cleaning & Normalization Script",  category: "Data Analysis",   description: "Automate the boring parts of data prep.",                      tags: ["Python","Cleaning"],      content: "Write a Python/Pandas script to clean the following dataset: [DESCRIPTION]. The script should: 1) Handle missing values by [STRATEGY], 2) Normalize [COLUMNS] using Min-Max scaling, 3) Convert [DATE_COLUMN] to datetime format, and 4) Remove duplicates based on [KEY_COLUMNS]." },
      { id: 157, title: "Executive Summary Generator",      category: "Data Analysis",   description: "Turn complex analysis into a 1-page brief.",                   tags: ["Reporting","Business"],   content: "Convert this 10-page data analysis report: [REPORT] into a 1-page executive summary. Structure: 1) The 'Bottom Line Up Front' (BLUF), 2) Key performance indicators (KPIs), 3) Strategic recommendations, and 4) Immediate next steps. Use high-impact, results-oriented language." },

      // PERSONAL PRODUCTIVITY (158-164)
      { id: 158, title: "Anti-Procrastination Coach",       category: "Personal Productivity", description: "Break through mental blocks with behavioral science.",  tags: ["Productivity","Mindset"], content: "I am procrastinating on [TASK] because [REASON]. Use behavioral science techniques (like Temptation Bundling, The 2-Minute Rule, or Implementation Intentions) to create a specific, low-friction action plan to get me started in the next 5 minutes." },
      { id: 159, title: "Energy-Based Schedule Designer",   category: "Personal Productivity", description: "Map tasks to your natural circadian rhythms.",           tags: ["Time Management","Energy"],content: "I am most focused during [TIME PERIOD A] and experience an energy slump during [TIME PERIOD B]. Here is my task list: [TASKS]. Categorize these tasks into 'Deep Work', 'Shallow Work', and 'Rest', then place them in an optimized daily schedule based on my energy levels." },
      { id: 160, title: "Decision Fatigue Reducer",         category: "Personal Productivity", description: "Automate recurring low-stakes choices.",                 tags: ["Automation","Life-Hack"], content: "I spend too much time deciding on [RECURRING CHOICE, e.g., what to eat for lunch]. Create a 4-week automated system/rotation that removes the need for daily decision-making. Ensure it accounts for [CONSTRAINTS, e.g., dietary restrictions, budget]." },
      { id: 161, title: "Meeting Debt Auditor",             category: "Personal Productivity", description: "Evaluate if a meeting should have been an email.",        tags: ["Work","Meetings"],        content: "Audit the following meeting invite: [DETAILS]. 1) Determine if the objective can be achieved asynchronously, 2) If not, suggest a 50% shorter agenda, 3) Identify the 'essential' vs. 'optional' attendees, and 4) Provide an email template to politely decline or suggest an alternative." },
      { id: 162, title: "Goal-to-Habit Converter",          category: "Personal Productivity", description: "Turn ambitious goals into daily atomic actions.",         tags: ["Habits","Atomic"],        content: "My goal is to [GOAL]. Using the 'Atomic Habits' framework: 1) Identify the 'Lead Measure' (the one daily action that drives the goal), 2) Create a habit stack (After [CURRENT HABIT], I will [NEW HABIT]), and 3) Design an environment trigger to make the habit obvious." },
      { id: 163, title: "Digital Minimalism Audit",         category: "Personal Productivity", description: "Clean up your digital distractions.",                     tags: ["Focus","Minimalism"],     content: "I spend [X] hours/day on [APP/PLATFORM]. Design a digital minimalism protocol to reduce this. Include: 1) Specific app-limit settings, 2) A 'replacement' high-value activity, 3) Home screen reorganization tips, and 4) A 'Digital Sabbath' plan for the weekend." },
      { id: 164, title: "Personal Knowledge Manager",       category: "Personal Productivity", description: "Organize notes using the PARA method.",                   tags: ["Organization","Second Brain"],content: "I have the following disorganized notes and files: [LIST]. Categorize them using Tiago Forte's PARA method (Projects, Areas, Resources, Archives). For each item, explain why it belongs in that category and suggest a naming convention for easy retrieval." },

      // VIDEO GENERATION CONTINUED (165-173)
      { id: 165, title: "First-Person FPV Drone",           category: "Video Generation", description: "High-speed, dynamic flight through obstacles.",               tags: ["FPV","Drone"],            content: "A high-speed FPV drone shot flying through a [LOCATION, e.g., dense forest, abandoned factory]. The camera should perform a barrel roll while narrowly missing [OBJECTS], maintaining motion blur and a sense of extreme speed." },
      { id: 166, title: "Temporal Hyperlapse",              category: "Video Generation", description: "Show months of change in seconds.",                           tags: ["Hyperlapse","Time"],      content: "A cinematic hyperlapse of [LOCATION] showing the transition from [SEASON A] to [SEASON B]. The lighting should shift from morning to night repeatedly while the camera moves slowly forward along a path." },
      { id: 167, title: "Macro Liquid Fusion",              category: "Video Generation", description: "Abstract slow-motion ink/water interaction.",                  tags: ["Abstract","Slow-Mo"],     content: "Macro slow-motion shot of colorful inks dropping into a clear viscous liquid. The colors should swirl and collide in 4k resolution, with light refracting through the ripples. 120fps feel." },
      { id: 168, title: "Character Emote: Subtle",          category: "Video Generation", description: "Realistic emotional transitions for AI avatars.",              tags: ["Character","Emotion"],    content: "A close-up portrait of a character transitioning from a neutral expression to [EMOTION, e.g., a subtle knowing smile, realization of grief]. Focus on micro-expressions in the eyes and corners of the mouth. Cinematic lighting." },
      { id: 169, title: "Product Reveal: Shadow Play",      category: "Video Generation", description: "Dramatic lighting for e-commerce videos.",                    tags: ["Product","Commercial"],   content: "A dramatic product reveal of [PRODUCT] using dynamic shadows. The camera circles the product while a single harsh light source rotates around it, revealing textures and sleek lines through silhouette and highlights." },
      { id: 170, title: "B-Roll: Handheld Gritty",          category: "Video Generation", description: "Documentary-style handheld movement.",                        tags: ["Documentary","B-Roll"],   content: "A handheld, slightly shaky B-roll shot of [ACTION, e.g., someone fixing a vintage watch]. Use a shallow depth of field, natural 'found' lighting, and a gritty, 16mm film grain aesthetic." },
      { id: 171, title: "Isometric 3D Animation",           category: "Video Generation", description: "Clean, toy-like loop for tech explainers.",                   tags: ["Isometric","3D"],         content: "An isometric 3D animation of a [SYSTEM, e.g., data server, smart home]. Elements should pop in and out with a 'toy-like' physics, using a vibrant but professional color palette and smooth, eased transitions. Perfect loop." },
      { id: 172, title: "Nature: Atmospheric Mist",         category: "Video Generation", description: "Ethereal, slow-moving landscape shots.",                      tags: ["Nature","Atmospheric"],   content: "A wide-angle shot of a [LOCATION, e.g., redwood forest, mountain peak] at dawn. Thick mist should be rolling through the trees/valleys, with 'god rays' of sunlight piercing through. Minimal camera movement (slow drift)." },
      { id: 173, title: "Sci-Fi: Warp Speed",               category: "Video Generation", description: "Classic light-streak space travel effect.",                   tags: ["Sci-Fi","Space"],         content: "A first-person perspective shot from a cockpit entering 'warp speed'. The stars should stretch into long neon light streaks, with a subtle camera shake and a lens flare as the ship accelerates into the void." },

      // ADDITIONAL CODING (174-178)
      { id: 174, title: "Tailwind Component Architect",     category: "Coding",           description: "Generate responsive, accessible UI with Tailwind CSS.",        tags: ["Tailwind","Frontend"],    content: "Generate a responsive [COMPONENT NAME, e.g., Pricing Table, Navigation Bar] using Tailwind CSS and React. Ensure it is fully accessible (ARIA labels), includes a dark mode variant, and follows a [STYLE, e.g., Neumorphic, Glassmorphic] aesthetic." },
      { id: 175, title: "TypeScript Type Guard Generator",  category: "Coding",           description: "Ensure type safety for complex API responses.",                 tags: ["TypeScript","Safety"],    content: "Given the following JSON response from an API: [JSON], generate a set of robust TypeScript interfaces and 'Type Guard' functions to validate the data at runtime. Handle optional fields and potential null values gracefully." },
      { id: 176, title: "GitHub Action CI/CD Pipeline",     category: "Coding",           description: "Automate testing, linting, and deployment.",                   tags: ["DevOps","GitHub"],        content: "Write a GitHub Actions workflow for a [LANGUAGE] project. The pipeline should: 1) Run on every push to 'main', 2) Install dependencies, 3) Run unit tests and linting, 4) Build the project, and 5) Deploy to [PLATFORM] only if all previous steps pass." },
      { id: 177, title: "Python Web Scraper (Bypass)",      category: "Coding",           description: "Extract data from dynamic websites ethically.",                 tags: ["Python","Scraping"],      content: "Write a Python script using Playwright to scrape [DATA] from [URL]. The script should handle: 1) Dynamic content loading (waiting for selectors), 2) Basic pagination, 3) Random user-agent rotation, and 4) Exporting the final data to a structured JSON file." },
      { id: 178, title: "Legacy Code Refactorer",           category: "Coding",           description: "Modernize old codebases while maintaining functionality.",      tags: ["Refactoring","Clean Code"],content: "Refactor the following legacy [LANGUAGE] code: [CODE]. Your goals are: 1) Improve readability, 2) Reduce cognitive complexity, 3) Implement modern syntax (e.g., ES6+ or Python 3.10+), and 4) Ensure the logic remains identical. Provide a summary of the changes made." },

      // ADDITIONAL CAREER (179-183)
      { id: 179, title: "Job Description Optimizer",        category: "Career",           description: "Tailor your resume to specific job postings.",                  tags: ["Resume","ATS"],           content: "Analyze the following job description: [JD] and my current resume: [RESUME]. Identify the top 5 'must-have' skills I'm missing or under-emphasizing. Suggest specific bullet points I should add to my resume to pass ATS filters for this role." },
      { id: 180, title: "LinkedIn Thought Leader",          category: "Career",           description: "Turn professional insights into engaging posts.",               tags: ["LinkedIn","Personal Brand"],content: "I had a realization at work today: [INSIGHT]. Turn this into a high-engagement LinkedIn post. Structure it with: 1) A 'scroll-stopping' hook, 2) The 'Problem' I faced, 3) The 'Aha!' moment, 4) 3 actionable tips for my peers, and 5) A question to drive comments." },
      { id: 181, title: "Interview Simulation: FAANG",      category: "Career",           description: "Practice behavioral and technical questions.",                  tags: ["Interview","Career"],     content: "Act as a Senior Hiring Manager at [COMPANY]. I am interviewing for a [ROLE]. Conduct a 10-minute mock interview. Ask me 1 behavioral question (using the STAR method) and 1 technical/situational question. After I answer each, provide 'brutally honest' feedback on my delivery and content." },
      { id: 182, title: "The 'Brag Document' Builder",      category: "Career",           description: "Track wins for easier performance reviews.",                   tags: ["Growth","Reviews"],       content: "Help me build a 'Brag Document' for the last quarter. Based on my activities: [LIST], structure them into: 1) Major Projects, 2) Contributions to the team/culture, 3) Personal growth/learning, and 4) Quantified business impact (Revenue, Time saved, etc.)." },
      { id: 183, title: "Freelance Proposal Closer",        category: "Career",           description: "Write winning bids for Upwork/consulting.",                    tags: ["Freelance","Sales"],      content: "Write a personalized proposal for this project: [PROJECT DESCRIPTION]. Do not use a generic template. Instead: 1) Acknowledge their specific pain point in the first sentence, 2) Briefly explain my relevant experience with [SPECIFIC SKILL], 3) Propose a 3-step execution plan, and 4) Ask a clarifying question to start the conversation." },

      // GEMINI 3.1 PRO — SVG ANIMATIONS (184-189)
      { id: 184, title: "Animated Pelican SVG",             category: "Image Generation", description: "Complex pelican riding a bicycle with moving legs.",            tags: ["SVG","Animation","Gemini 3.1"],content: "Create a complex, animated SVG of a pelican riding a bicycle. The pelican's legs should move on both sides of the frame, and it should have a fish in a basket on the front. Ensure perfect coordination and spatial logic." },
      { id: 185, title: "Animated Frog SVG",                category: "Image Generation", description: "Frog on a penny-farthing bicycle with realistic motion.",       tags: ["SVG","Animation","Gemini 3.1"],content: "Generate an animated SVG of a frog riding a penny-farthing (high-wheeler) bicycle with realistic pedaling motion and spatial accuracy." },
      { id: 186, title: "Animated Giraffe SVG",             category: "Image Generation", description: "Giraffe driving a tiny car with smooth motion.",                tags: ["SVG","Animation","Gemini 3.1"],content: "Create an animated SVG of a giraffe driving a tiny car. The animation should handle the giraffe's long neck and the small vehicle with smooth motion and spatial reasoning." },
      { id: 187, title: "Animated Ostrich SVG",             category: "Image Generation", description: "Ostrich on roller skates with coordinated movement.",            tags: ["SVG","Animation","Gemini 3.1"],content: "Generate an animated SVG of an ostrich on roller skates, showing coordinated leg movements and balanced motion." },
      { id: 188, title: "Animated Turtle SVG",              category: "Image Generation", description: "Turtle performing a 'kickflip' on a skateboard.",               tags: ["SVG","Animation","Gemini 3.1"],content: "Create an animated SVG of a turtle performing a 'kickflip' on a skateboard, showcasing advanced spatial logic and fluid animation." },
      { id: 189, title: "Animated Dachshund SVG",           category: "Image Generation", description: "Dachshund driving a stretch limousine.",                        tags: ["SVG","Animation","Gemini 3.1"],content: "Generate an animated SVG of a dachshund driving a stretch limousine, handling the long body of both the dog and the car with perfect coordination." },

      // GEMINI 3.1 PRO — ADVANCED (190-198)
      { id: 190, title: "Wuthering Heights Portfolio",       category: "Design",           description: "Mood-based photography portfolio design.",                     tags: ["UX","Vibe Coding","Gemini 3.1"],content: "Design a modern photography portfolio website as if it were owned by a character from Emily Brontë's Wuthering Heights. Infer a gloomy, wild, and moor-like aesthetic, translating the literary atmosphere into a contemporary, functional web interface." },
      { id: 191, title: "Starling Murmuration 3D",          category: "Coding",           description: "3D simulation of a flock of birds.",                           tags: ["3D","Simulation","Gemini 3.1"],content: "Generate code for a complex 3D simulation of a flock of starlings (murmuration). Optimize for spatial reasoning and efficient rendering of hundreds of individual agents." },
      { id: 192, title: "Hand-Tracking Interaction",         category: "Coding",           description: "Real-time camera-based hand tracking.",                        tags: ["Computer Vision","Interactivity","Gemini 3.1"],content: "Implement hand-tracking integration for an interactive simulation. Allow users to use their camera to 'track' their hands and manipulate on-screen elements (like a flock of birds) in real-time." },
      { id: 193, title: "Generative Soundscapes",           category: "Audio & Music",    description: "Responsive music based on movement patterns.",                  tags: ["Audio","Generative","Gemini 3.1"],content: "Generate code for a responsive background soundscape. The music should shift in tone, tempo, and harmony based on real-time movement patterns of on-screen agents, creating an immersive multimodal experience." },
      { id: 194, title: "ISS Aerospace Dashboard",           category: "Data Analysis",    description: "Live telemetry dashboard for the ISS.",                        tags: ["Data Viz","Real-time","Gemini 3.1"],content: "Build a real-time ISS (International Space Station) aerospace dashboard from scratch. Integrate live ISS telemetry streams and visualize the station's trajectory and status in a professional-grade UI." },
      { id: 195, title: "Edit-then-Test Agent",              category: "Agentic AI",       description: "Autonomous bug identification and fixing.",                    tags: ["Coding Agent","Testing","Gemini 3.1"],content: "Act as an advanced coding agent. Autonomously identify a bug in a large repository (up to 30,000 lines), write a fix, generate a unit test, and verify the result with minimal tool calls. Optimize for the Gemini 3.1 Pro model's reasoning capabilities." },
      { id: 196, title: "Extended Output Refactor",          category: "Agentic AI",       description: "Refactor massive files in a single pass.",                     tags: ["Code Refactor","Long Context","Gemini 3.1"],content: "Refactor an entire massive code file (up to 60k tokens) in a single pass without truncation, leveraging the 65,536 output token limit to maintain architectural consistency across the entire file." },
      { id: 197, title: "ARC-AGI-2 Logic Grid",             category: "Problem Solving",  description: "Visual logic grid solver for benchmarks.",                     tags: ["Logic","Reasoning","Gemini 3.1"],content: "Solve this visual logic grid from the ARC-AGI-2 benchmark. Use abstract reasoning to identify the underlying pattern and generate the correct output grid for the unseen test case. Achieve a high score through advanced spatial and logical inference." },
      { id: 198, title: "GPQA Diamond Solver",              category: "Problem Solving",  description: "PhD-level physics and biology reasoning.",                     tags: ["Science","PhD-Level","Gemini 3.1"],content: "Solve this doctoral-level PhD question in physics or biology from the GPQA Diamond benchmark. Provide a step-by-step reasoning process and the final answer, aiming for superhuman accuracy (94%+)." },

      // NANO BANANA 2 (199-200)
      { id: 199, title: "Nano Banana 2: Web-Grounded Factuality", category: "Image Generation", description: "Hyper-accurate visuals powered by real-time web search grounding.", tags: ["Image Gen","Web-Grounded","Nano Banana 2"], content: "Generate a hyper-realistic image of [SUBJECT], leveraging Nano Banana 2's real-time web search grounding to ensure every detail is factually accurate and up-to-date. Focus on [SPECIFIC DETAIL] and ensure accurate text rendering for any labels or signage. Use vibrant lighting and rich textures to achieve studio-quality visual fidelity at Flash speed." },
      { id: 200, title: "Nano Banana 2: Narrative Consistency", category: "Video Generation", description: "Storyboarding with perfect character and object resemblance.", tags: ["Video Gen","Storyboarding","Consistency","Nano Banana 2"], content: "Act as a cinematic storyboard artist. Using Nano Banana 2's subject consistency feature, generate a sequence of 4 consistent frames for a video project titled '[TITLE]'. Maintain the exact resemblance of up to 3 characters and 5 key objects across all frames. Frame 1: Establishing shot; Frame 2: Mid-shot action; Frame 3: Close-up reaction; Frame 4: Wide-angle resolution. Ensure lighting and art style remain perfectly synchronized. Aspect ratio 16:9." }
    ];

    /* ──────────────────────────────────────────────────────────
       APP COMPONENT
    ────────────────────────────────────────────────────────── */
    const App = () => {
      const [search,     setSearch]     = useState("");
      const [filter,     setFilter]     = useState("All");
      const [toast,      setToast]      = useState("");
      const [expandedId, setExpandedId] = useState(null);
      const [viewMode,   setViewMode]   = useState("grid");

      /* Stable category list — memoized once */
      const categories = useMemo(
        () => ["All", ...Array.from(new Set(promptData.map(p => p.category)))],
        []
      );

      /* Reset expanded card whenever search or filter changes */
      useEffect(() => { setExpandedId(null); }, [search, filter]);

      /* Initialize Lucide icons on every render that might change them */
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [filteredItems, viewMode, expandedId]);

      /* Filtered data */
      const filteredItems = useMemo(() => {
        const q = search.toLowerCase();
        return promptData.filter(p => {
          const matchCat    = filter === "All" || p.category === filter;
          const matchSearch = !q ||
            p.title.toLowerCase().includes(q) ||
            p.description.toLowerCase().includes(q) ||
            p.tags.some(t => t.toLowerCase().includes(q));
          return matchCat && matchSearch;
        });
      }, [search, filter]);

      /* Per-category count map */
      const categoryCounts = useMemo(() => {
        const m = {};
        promptData.forEach(p => { m[p.category] = (m[p.category] || 0) + 1; });
        return m;
      }, []);

      /* Derived stats — note: categories.length is stable so safe in deps */
      const stats = useMemo(() => ({
        total:    promptData.length,
        cats:     categories.length - 1,   // exclude "All"
        showing:  filteredItems.length,
      }), [filteredItems.length, categories.length]);

      /* Clipboard copy with fallback for non-HTTPS contexts */
      const copyToClipboard = useCallback((text, title) => {
        const fallback = () => {
          const el = document.createElement("textarea");
          el.value = text;
          el.setAttribute("readonly", "");
          el.style.cssText = "position:absolute;left:-9999px";
          document.body.appendChild(el);
          el.select();
          document.execCommand("copy");
          document.body.removeChild(el);
          setToast(`✓ Copied "${title}"`);
        };

        if (!navigator.clipboard) {
          fallback();
        } else {
          navigator.clipboard.writeText(text)
            .then(() => setToast(`✓ Copied "${title}"`))
            .catch(fallback);
        }
        setTimeout(() => setToast(""), 2800);
      }, []);

      const handleReset = useCallback(() => {
        setSearch("");
        setFilter("All");
        setExpandedId(null);
      }, []);

      return (
        <div style={{ minHeight: "100vh" }}>

          {/* ── STICKY HEADER ── */}
          <header className="header-glass" style={{ position: "sticky", top: 0, zIndex: 50 }}>
            <div style={{ maxWidth: 1280, margin: "0 auto", padding: "20px 24px" }}>
              <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", justifyContent: "space-between", gap: 16 }}>

                {/* Wordmark */}
                <div>
                  <h1 className="display-font" style={{ fontSize: "clamp(22px,4vw,34px)", fontWeight: 800, color: "var(--color-text)", lineHeight: 1.1, letterSpacing: "-0.02em" }}>
                    AI Prompt<span className="accent-text"> Library</span>
                    <span style={{ fontSize: "0.45em", fontWeight: 600, color: "var(--color-muted)", marginLeft: 10, verticalAlign: "middle" }}>2026</span>
                  </h1>
                  <p style={{ fontSize: 12, color: "var(--color-muted)", marginTop: 4, fontFamily: "'Hanken Grotesk', sans-serif", letterSpacing: "0.04em" }}>
                    {stats.total} prompts · {stats.cats} categories · v4.2.0
                  </p>
                </div>

                {/* Controls */}
                <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                  <label htmlFor="prompt-search" className="sr-only">Search prompts</label>
                  <input
                    id="prompt-search"
                    type="text"
                    className="search-input"
                    placeholder="🔍 Search prompts, tags…"
                    value={search}
                    onChange={e => setSearch(e.target.value)}
                    style={{ minWidth: 220, maxWidth: 340 }}
                  />

                  <div role="group" aria-label="View mode" style={{ display: "flex", gap: 6 }}>
                    <button type="button" className={`btn-view${viewMode === "grid" ? " active" : ""}`}
                      onClick={() => setViewMode("grid")}
                      aria-label="Grid view" aria-pressed={viewMode === "grid"}>
                      <i data-lucide="layout-grid" style={{ width: 18, height: 18 }}></i>
                    </button>
                    <button type="button" className={`btn-view${viewMode === "list" ? " active" : ""}`}
                      onClick={() => setViewMode("list")}
                      aria-label="List view" aria-pressed={viewMode === "list"}>
                      <i data-lucide="list" style={{ width: 18, height: 18 }}></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </header>

          <main style={{ maxWidth: 1280, margin: "0 auto", padding: "32px 24px 60px" }}>

            {/* ── STATS BAR ── */}
            <div style={{ display: "flex", gap: 16, marginBottom: 28, flexWrap: "wrap" }}>
              {[
                { num: stats.total,   label: "Total Prompts" },
                { num: stats.cats,    label: "Categories"    },
                { num: stats.showing, label: "Showing"       },
              ].map((s, i) => (
                <div key={i} className="stat-card" style={{ flex: "1 1 120px" }}>
                  <div className="stat-num">{s.num}</div>
                  <div className="stat-label">{s.label}</div>
                </div>
              ))}
            </div>

            {/* ── CATEGORY FILTER ── */}
            <nav aria-label="Category filter" style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 32 }}>
              {categories.map(c => (
                <button
                  type="button"
                  key={c}
                  className={`cat-pill${filter === c ? " active" : ""}`}
                  onClick={() => setFilter(c)}
                  aria-pressed={filter === c}
                >
                  {c}
                  {c !== "All" && (
                    <span style={{ marginLeft: 5, opacity: 0.65 }}>({categoryCounts[c]})</span>
                  )}
                </button>
              ))}
            </nav>

            {/* ── PROMPT CARDS ── */}
            {filteredItems.length > 0 ? (
              <div style={
                viewMode === "grid"
                  ? { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(310px, 1fr))", gap: 18 }
                  : { display: "flex", flexDirection: "column", gap: 10 }
              }>
                {filteredItems.map((p, idx) => (
                  <article
                    key={p.id}
                    className={`prompt-card fade-in${viewMode === "list" ? " list-card" : ""}`}
                    style={{
                      padding: viewMode === "list" ? undefined : "20px 22px 18px",
                      animationDelay: `${Math.min(idx * 0.04, 0.4)}s`,
                    }}
                  >
                    {/* List-mode: ID badge */}
                    {viewMode === "list" && (
                      <div className="list-id" aria-hidden="true">
                        {String(p.id).padStart(2, "0")}
                      </div>
                    )}

                    <div style={{ flex: 1 }}>
                      {/* Top row */}
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, marginBottom: 12 }}>
                        <span className="cat-badge">{p.category}</span>
                        <button
                          type="button"
                          className="btn-copy"
                          onClick={() => copyToClipboard(p.content, p.title)}
                          aria-label={`Copy prompt: ${p.title}`}
                          style={{ display: "flex", alignItems: "center", gap: 4 }}
                        >
                          <i data-lucide="copy" style={{ width: 12, height: 12 }}></i> Copy
                        </button>
                      </div>

                      {/* Title & description */}
                      <h3 className="display-font" style={{ fontSize: 16, fontWeight: 700, color: "var(--color-text)", marginBottom: 5, lineHeight: 1.3, letterSpacing: "-0.01em" }}>
                        {p.title}
                      </h3>
                      <p style={{ fontSize: 13, color: "var(--color-muted)", marginBottom: 10, fontFamily: "'Hanken Grotesk',sans-serif", lineHeight: 1.5 }}>
                        {p.description}
                      </p>

                      {/* Prompt preview */}
                      <div style={{ marginBottom: 12 }}>
                        <p style={{
                          fontSize: 12,
                          color: "var(--color-muted-2)",
                          lineHeight: 1.6,
                          fontFamily: "'Hanken Grotesk',sans-serif",
                          ...(expandedId === p.id ? {} : {
                            display: "-webkit-box",
                            WebkitLineClamp: 2,
                            WebkitBoxOrient: "vertical",
                            overflow: "hidden",
                          }),
                        }}>
                          {p.content}
                        </p>
                        {p.content.length > 90 && (
                          <button
                            type="button"
                            className="btn-expand"
                            onClick={() => setExpandedId(expandedId === p.id ? null : p.id)}
                            aria-expanded={expandedId === p.id}
                          >
                            <i data-lucide={expandedId === p.id ? "chevron-up" : "chevron-down"} style={{ width: 14, height: 14 }}></i>
                            {expandedId === p.id ? "Show less" : "Full prompt"}
                          </button>
                        )}
                      </div>

                      {/* Tags */}
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 5, borderTop: "1px solid var(--color-border)", paddingTop: 12 }}>
                        {p.tags.map(t => (
                          <span key={t} className="tag-chip">#{t}</span>
                        ))}
                      </div>
                    </div>
                  </article>
                ))}
              </div>
            ) : (
              /* ── EMPTY STATE ── */
              <div className="empty-state fade-in">
                <div className="empty-icon">
                  <i data-lucide="search-x" style={{ width: 64, height: 64, margin: "0 auto" }}></i>
                </div>
                <p className="display-font" style={{ fontSize: 20, fontWeight: 700, color: "var(--color-text)", marginBottom: 8 }}>
                  No prompts found
                </p>
                <p style={{ fontSize: 14, color: "var(--color-muted)", marginBottom: 4 }}>
                  Try a different search term or category.
                </p>
                <button type="button" className="btn-reset" onClick={handleReset}>
                  Reset Filters
                </button>
              </div>
            )}
          </main>

          {/* ── FOOTER ── */}
          <footer className="footer" style={{ padding: "28px 24px", textAlign: "center" }}>
            <p style={{ fontFamily: "'Hanken Grotesk',sans-serif", fontSize: 13, color: "var(--color-muted)" }}>
              Made with ❤️ by{" "}
              <a href="https://github.com/darshil0" className="link-accent">Darshil Shah</a>
              {" "}·{" "}MIT License{" "}·{" "}
              <a href="https://github.com/darshil0/ai-prompt-collection-2026" className="link-accent">GitHub</a>
            </p>
          </footer>

          {/* ── TOAST NOTIFICATION ── */}
          {toast && (
            <div
              className="toast"
              role="status"
              aria-live="polite"
            >
              {toast}
            </div>
          )}
        </div>
      );
    };

    /* ── MOUNT ── */
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>

</html>
